<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Компонент Button — Tailwind CSS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/tailwind.css" />
  </head>
  <body class="bg-slate-50 font-sans text-slate-900">
    <main class="mx-auto flex max-w-xl flex-col gap-8 p-6">
      <h1 class="text-2xl font-bold sm:text-3xl md:text-4xl lg:text-5xl">
        Primary CTA Button
      </h1>

      <section
        class="flex flex-col items-start gap-3"
        aria-labelledby="default-title"
      >
        <h2 id="default-title" class="text-lg font-semibold">Звичайний стан</h2>
        <button
          type="button"
          class="inline-flex min-h-11 w-full items-center justify-center rounded-full bg-rose-600 px-10 py-3 text-base font-semibold text-white transition-colors duration-200 hover:bg-green-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 active:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-600 disabled:text-slate-500 disabled:hover:bg-slate-300 md:w-auto"
        >
          Дізнатися більше
        </button>
      </section>

      <section
        class="flex flex-col items-start gap-3"
        aria-labelledby="disabled-title"
      >
        <h2 id="disabled-title" class="text-lg font-semibold">
          Неактивний стан (disabled)
        </h2>
        <button
          type="button"
          disabled
          class="inline-flex min-h-11 w-full items-center justify-center rounded-md bg-brand-500 px-6 py-3 text-base font-semibold text-slate-950 transition-colors duration-200 hover:bg-brand-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-500 active:bg-brand-700 disabled:cursor-not-allowed disabled:bg-slate-300 disabled:text-slate-500 disabled:hover:bg-slate-300 md:w-auto"
        >
          Дізнатися більше
        </button>
      </section>
    </main>
  </body>
</html>
